<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard — Paws & Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">🐾 Staff Panel</div>
    <nav>
      <button class="nav-btn active" data-panel="deliveries" onclick="switchPanel('deliveries')">🚚 My Deliveries</button>
      <button class="nav-btn" data-panel="vaccinations" onclick="switchPanel('vaccinations')">💉 Vaccinations</button>
    </nav>
    <button class="logout-btn" onclick="handleLogout()">🚪 Logout</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1 id="panelTitle">My Deliveries</h1>
      <div class="notif-wrap">
        <button class="notif-bell" onclick="toggleNotifPanel()">
          🔔 <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown" style="display:none;">
          <div class="notif-header">Notifications</div>
          <div id="notifList"><p class="empty-note">Loading…</p></div>
        </div>
      </div>
      <span class="who" id="whoAmI"></span>
    </div>

    <!-- My Deliveries Panel -->
    <section class="panel" id="panel-deliveries">
      <table class="data-table">
        <thead>
          <tr><th>Pet</th><th>Adopter</th><th>Phone</th><th>Address</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="deliveriesBody"></tbody>
      </table>
    </section>

    <!-- Vaccinations Panel (pet care) -->
    <section class="panel" id="panel-vaccinations" style="display:none;">
      <div class="panel-actions">
        <select id="vaxPetFilter" onchange="loadVaccinations()"><option value="">Select a pet...</option></select>
        <button class="btn btn-primary" onclick="openVaxForm()">+ Add Vaccination Record</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Pet</th><th>Vaccine</th><th>Date Given</th><th>Next Due</th><th>Actions</th></tr></thead>
        <tbody id="vaxBody"></tbody>
      </table>
    </section>
  </main>
</div>

<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="close" onclick="closeFormModal()">&times;</button>
    <div id="formModalContent"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="staff-script.js"></script>
</body>
</html>
