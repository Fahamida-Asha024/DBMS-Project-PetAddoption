<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard — Paws & Home</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin-style.css">
</head>
<body>

<div class="admin-shell">
  <aside class="sidebar">
    <div class="brand">🐾 Admin Panel</div>
    <nav>
      <button class="nav-btn active" data-panel="adoptions" onclick="switchPanel('adoptions')">📋 Adoption Requests</button>
      <button class="nav-btn" data-panel="pets" onclick="switchPanel('pets')">🐶 Manage Pets</button>
      <button class="nav-btn" data-panel="adopters" onclick="switchPanel('adopters')">👥 Adopters</button>
      <button class="nav-btn" data-panel="vaccinations" onclick="switchPanel('vaccinations')">💉 Vaccinations</button>
      <button class="nav-btn" data-panel="staff" onclick="switchPanel('staff')">🧑‍💼 Staff</button>
      <button class="nav-btn" data-panel="reports" onclick="switchPanel('reports')">📊 Reports</button>
    </nav>
    <button class="logout-btn" onclick="handleLogout()">🚪 Logout</button>
  </aside>

  <main class="content">
    <div class="topbar">
      <h1 id="panelTitle">Adoption Requests</h1>
      <div class="notif-wrap">
        <button class="notif-bell" onclick="toggleNotifPanel()">
          🔔 <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
        </button>
        <div class="notif-dropdown" id="notifDropdown" style="display:none;">
          <div class="notif-header">Notifications</div>
          <div id="notifList"><p class="empty-note">Loading…</p></div>
        </div>
      </div>
      <span class="who" id="whoAmI"></span>
    </div>

    <section class="panel" id="panel-adoptions">
      <div class="tab-row">
        <button class="tab active" data-status="pending" onclick="filterAdoptions('pending')">Pending</button>
        <button class="tab" data-status="approved" onclick="filterAdoptions('approved')">Approved</button>
        <button class="tab" data-status="rejected" onclick="filterAdoptions('rejected')">Rejected</button>
        <button class="tab" data-status="" onclick="filterAdoptions('')">All</button>
      </div>
      <table class="data-table">
        <thead>
          <tr>
            <th>Pet</th><th>Adopter</th><th>Contact</th><th>Requested</th>
            <th>Status</th><th>Action</th><th>Assign Staff</th><th>Delivery</th>
          </tr>
        </thead>
        <tbody id="adoptionsBody"></tbody>
      </table>
    </section>

    <section class="panel" id="panel-pets" style="display:none;">
      <div class="panel-actions">
        <input type="text" id="petSearch" placeholder="Search pets..." oninput="renderPetsTable()">
        <button class="btn btn-primary" onclick="openPetForm()">+ Add Pet</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Type</th><th>Breed</th><th>Age</th><th>Gender</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody id="petsBody"></tbody>
      </table>
    </section>

    <section class="panel" id="panel-adopters" style="display:none;">
      <table class="data-table">
        <thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th></tr></thead>
        <tbody id="adoptersBody"></tbody>
      </table>
    </section>

    <section class="panel" id="panel-vaccinations" style="display:none;">
      <div class="panel-actions">
        <select id="vaxPetFilter" onchange="loadVaccinations()"><option value="">Select a pet...</option></select>
        <button class="btn btn-primary" onclick="openVaxForm()">+ Add Vaccination Record</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Pet</th><th>Vaccine</th><th>Date Given</th><th>Next Due</th><th>Actions</th></tr></thead>
        <tbody id="vaxBody"></tbody>
      </table>
    </section>

    <section class="panel" id="panel-staff" style="display:none;">
      <div class="panel-actions">
        <button class="btn btn-primary" onclick="openStaffForm()">+ Add Staff Member</button>
      </div>
      <table class="data-table">
        <thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Phone</th></tr></thead>
        <tbody id="staffBody"></tbody>
      </table>
    </section>

    <section class="panel" id="panel-reports" style="display:none;">
      <div class="stat-grid" id="reportStats"></div>
    </section>
  </main>
</div>


<div class="overlay" id="formOverlay">
  <div class="modal">
    <button class="close" onclick="closeFormModal()">&times;</button>
    <div id="formModalContent"></div>
  </div>
</div>

<script src="api.js"></script>
<script src="admin-script.js"></script>
</body>
</html>
